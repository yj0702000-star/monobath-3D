<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONOBATH 3D Viewer</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F6F3;
      font-family: Arial, sans-serif;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 500px;
      background: #F7F6F3;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;

      --poster-color: transparent;
      --progress-bar-color: #2E2E2E;
    }

    .label {
      position: absolute;
      top: 28px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
    }

    .label-small {
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: #A49E94;
    }

    .label-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #2E2E2E;
    }

    .guide {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      font-size: 11px;
      letter-spacing: 0.12em;
      color: #777;

      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="viewer">

    <div class="label">
      <div class="label-small">MONOBATH</div>
      <div class="label-title">MONO 600</div>
    </div>

    <model-viewer
      src="./MONOBATH_MONO600.glb"

      alt="MONOBATH MONO 600 seamless basin"

      camera-controls
      touch-action="pan-y"

      interaction-prompt="none"

      shadow-intensity="0.7"
      shadow-softness="0.9"

      exposure="1.05"

      camera-orbit="0deg 75deg auto"
      min-camera-orbit="-90deg 55deg auto"
      max-camera-orbit="90deg 100deg auto"

      min-field-of-view="25deg"
      max-field-of-view="45deg"

      environment-image="neutral">

    </model-viewer>

    <div class="guide">
      DRAG TO EXPLORE · SCROLL TO ZOOM
    </div>

  </div>

</body>
</html>
