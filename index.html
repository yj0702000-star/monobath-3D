<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MONOBATH — MONO 600 Configurator</title>

<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #C9C0B4;
    font-family:
      Arial,
      Helvetica,
      sans-serif;
  }

  body {
    color: #2E2E2E;
  }

  #app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #C9C0B4;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }


  /* ===================================
     TOP BRAND
  =================================== */

  .brand {
    position: fixed;
    z-index: 20;

    top: 30px;
    left: 34px;

    pointer-events: none;
  }

  .brand-small {
    font-size: 10px;
    font-weight: 500;

    letter-spacing: 0.24em;

    color: rgba(46,46,46,.62);

    margin-bottom: 7px;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 600;

    letter-spacing: 0.05em;

    color: #2E2E2E;
  }


  /* ===================================
     TOP RIGHT
  =================================== */

  .top-controls {
    position: fixed;
    z-index: 20;

    top: 27px;
    right: 30px;

    display: flex;
    gap: 9px;
  }

  .ghost-button {
    height: 38px;

    padding: 0 16px;

    border-radius: 100px;

    border:
      1px solid rgba(46,46,46,.18);

    background:
      rgba(247,246,243,.72);

    backdrop-filter: blur(12px);

    font-size: 10px;
    font-weight: 500;

    letter-spacing: .12em;

    color: #2E2E2E;

    cursor: pointer;

    transition:
      background .25s ease,
      border-color .25s ease;
  }

  .ghost-button:hover {
    background:
      rgba(247,246,243,.95);

    border-color:
      rgba(46,46,46,.35);
  }


  /* ===================================
     CONFIGURATOR PANEL
  =================================== */

  .config-panel {

    position: fixed;

    z-index: 20;

    right: 30px;
    bottom: 30px;

    width: 270px;

    padding: 22px 22px 20px;

    border:
      1px solid rgba(46,46,46,.12);

    background:
      rgba(247,246,243,.84);

    backdrop-filter:
      blur(18px);

    border-radius: 3px;

    box-shadow:
      0 15px 50px rgba(0,0,0,.07);
  }

  .option-block + .option-block {
    margin-top: 22px;
    padding-top: 20px;

    border-top:
      1px solid rgba(46,46,46,.10);
  }

  .option-label {
    font-size: 9px;
    font-weight: 600;

    letter-spacing: .19em;

    color: rgba(46,46,46,.54);

    margin-bottom: 13px;
  }

  .option-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 12px;
    font-weight: 500;

    margin-bottom: 12px;
  }

  .current-value {
    font-size: 10px;

    color: rgba(46,46,46,.50);
  }

  .swatches {
    display: flex;
    gap: 10px;
  }

  .swatch {
    width: 31px;
    height: 31px;

    border-radius: 50%;

    border:
      1px solid rgba(46,46,46,.15);

    cursor: pointer;

    position: relative;

    transition:
      transform .2s ease,
      box-shadow .2s ease;
  }

  .swatch:hover {
    transform: scale(1.08);
  }

  .swatch.active::after {
    content: "";

    position: absolute;

    inset: -5px;

    border-radius: 50%;

    border:
      1px solid rgba(46,46,46,.65);
  }


  /* ===================================
     GUIDE
  =================================== */

  .guide {

    position: fixed;

    z-index: 20;

    left: 50%;
    bottom: 31px;

    transform:
      translateX(-50%);

    font-size: 9px;

    font-weight: 500;

    letter-spacing: .16em;

    color:
      rgba(46,46,46,.48);

    pointer-events: none;

    white-space: nowrap;

    transition:
      opacity .5s ease;
  }

  .guide.hide {
    opacity: 0;
  }


  /* ===================================
     LOADER
  =================================== */

  #loader {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: #F7F6F3;

    transition:
      opacity .55s ease,
      visibility .55s ease;
  }

  #loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  .loader-brand {

    font-size: 12px;
    font-weight: 600;

    letter-spacing: .23em;

    margin-bottom: 19px;
  }

  .loader-line {

    width: 130px;
    height: 1px;

    background:
      rgba(46,46,46,.15);

    overflow: hidden;
  }

  .loader-progress {

    width: 0%;
    height: 100%;

    background: #2E2E2E;

    transition:
      width .15s linear;
  }


  /* ===================================
     MOBILE
  =================================== */

  @media(max-width: 768px) {

    .brand {
      top: 20px;
      left: 20px;
    }

    .top-controls {
      top: 18px;
      right: 18px;
    }

    .ghost-button {
      padding: 0 13px;
    }

    .config-panel {

      left: 14px;
      right: 14px;

      bottom: 14px;

      width: auto;

      display: flex;
      gap: 22px;

      padding: 17px 18px;
    }

    .option-block {

      flex: 1;
    }

    .option-block + .option-block {

      margin-top: 0;

      padding-top: 0;

      border-top: 0;

      border-left:
        1px solid rgba(46,46,46,.10);

      padding-left: 20px;
    }

    .swatch {

      width: 27px;
      height: 27px;
    }

    .guide {

      bottom: 150px;

      font-size: 8px;
    }

  }

</style>


<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

</head>


<body>

<div id="app"></div>


<!-- LOADER -->

<div id="loader">

  <div class="loader-brand">
    MONOBATH
  </div>

  <div class="loader-line">
    <div
      class="loader-progress"
      id="loaderProgress">
    </div>
  </div>

</div>


<!-- BRAND -->

<div class="brand">

  <div class="brand-small">
    MONOBATH
  </div>

  <div class="brand-title">
    MONO 600 CONFIGURATOR
  </div>

</div>


<!-- TOP -->

<div class="top-controls">

  <button
    class="ghost-button"
    id="resetView">

    RESET VIEW

  </button>

</div>


<!-- GUIDE -->

<div
  class="guide"
  id="guide">

  DRAG TO ROTATE · DRAG UP TO VIEW TOP · SCROLL TO ZOOM

</div>


<!-- CONFIG -->

<div class="config-panel">


  <!-- BASIN -->

  <div class="option-block">

    <div class="option-label">
      BASIN COLOR
    </div>

    <div class="option-title">

      <span>MONO 600</span>

      <span
        class="current-value"
        id="basinName">

        PURE WHITE

      </span>

    </div>

    <div class="swatches">

      <button
        class="swatch basin-swatch"
        data-color="#E4E5E3"
        data-name="FROZEN WHITE"
        style="background:#E4E5E3">
      </button>

      <button
        class="swatch basin-swatch active"
        data-color="#F4F3EF"
        data-name="PURE WHITE"
        style="background:#F4F3EF">
      </button>

      <button
        class="swatch basin-swatch"
        data-color="#C7B8A3"
        data-name="SAND BEIGE"
        style="background:#C7B8A3">
      </button>

      <button
        class="swatch basin-swatch"
        data-color="#858784"
        data-name="URBAN GREY"
        style="background:#858784">
      </button>

    </div>

  </div>


  <!-- TILE -->

  <div class="option-block">

    <div class="option-label">
      600 × 600 TILE
    </div>

    <div class="option-title">

      <span>BACKGROUND</span>

      <span
        class="current-value"
        id="tileName">

        IVORY

      </span>

    </div>

    <div class="swatches">

      <button
        class="swatch tile-swatch"
        data-color="#E8E7E3"
        data-name="WHITE"
        style="background:#E8E7E3">
      </button>

      <button
        class="swatch tile-swatch active"
        data-color="#BEB3A5"
        data-name="IVORY"
        style="background:#BEB3A5">
      </button>

      <button
        class="swatch tile-swatch"
        data-color="#A6A6A3"
        data-name="GREY"
        style="background:#A6A6A3">
      </button>

      <button
        class="swatch tile-swatch"
        data-color="#484846"
        data-name="CHARCOAL"
        style="background:#484846">
      </button>

    </div>

  </div>

</div>



<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
  RGBELoader
} from "three/addons/loaders/RGBELoader.js";

import {
  RoomEnvironment
} from "three/addons/environments/RoomEnvironment.js";


/* =====================================================
   DOM
===================================================== */

const container =
  document.getElementById("app");

const guide =
  document.getElementById("guide");

const loaderElement =
  document.getElementById("loader");

const loaderProgress =
  document.getElementById("loaderProgress");

const basinName =
  document.getElementById("basinName");

const tileName =
  document.getElementById("tileName");


/* =====================================================
   SCENE
===================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color("#C9C0B4");


/* =====================================================
   CAMERA
   ★ 카메라는 여기서 완전히 고정
===================================================== */

const camera =
  new THREE.PerspectiveCamera(
    34,
    window.innerWidth /
    window.innerHeight,
    0.01,
    100
  );

camera.position.set(
  0,
  1.12,
  2.35
);

camera.lookAt(
  0,
  0.78,
  0.05
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  0.70;

renderer.shadowMap.enabled =
  true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.domElement.style.cursor =
  "grab";

container.appendChild(
  renderer.domElement
);


/* =====================================================
   HDRI
===================================================== */

const pmrem =
  new THREE.PMREMGenerator(
    renderer
  );

const roomEnvironment =
  new RoomEnvironment();

scene.environment =
  pmrem
    .fromScene(
      roomEnvironment,
      0.04
    )
    .texture;


/*
   GitHub에 이미 있는 HDR
*/
new RGBELoader().load(

  "./white_studio_06_1k.hdr",

  hdr => {

    const env =
      pmrem
        .fromEquirectangular(
          hdr
        )
        .texture;

    scene.environment =
      env;

    hdr.dispose();

  },

  undefined,

  error => {

    console.warn(
      "HDRI load failed. Fallback active.",
      error
    );

  }

);


/* =====================================================
   WEB LIGHTING
===================================================== */


/*
   왼쪽 위 큰 소프트박스 느낌
*/
const keyLight =
  new THREE.DirectionalLight(
    0xFFF2E2,
    1.70
  );

keyLight.position.set(
  -2.8,
  3.8,
  3.2
);

keyLight.castShadow =
  true;

keyLight.shadow.mapSize.set(
  2048,
  2048
);

keyLight.shadow.bias =
  -0.00015;

scene.add(
  keyLight
);


/*
   반대편 아주 약한 Fill
*/
const fillLight =
  new THREE.DirectionalLight(
    0xDDE4E8,
    0.18
  );

fillLight.position.set(
  3,
  2,
  2
);

scene.add(
  fillLight
);


/*
   전체 환경광
*/
const hemiLight =
  new THREE.HemisphereLight(
    0xFFFFFF,
    0x8F887E,
    0.20
  );

scene.add(
  hemiLight
);


/* =====================================================
   TILE GENERATOR
===================================================== */

function makeTileTexture(
  baseColor
) {

  const size = 512;

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    size;

  canvas.height =
    size;

  const ctx =
    canvas.getContext(
      "2d"
    );


  /* base */

  ctx.fillStyle =
    baseColor;

  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  /*
     아주 미세한 표면 입자
  */

  const image =
    ctx.getImageData(
      0,
      0,
      size,
      size
    );

  const data =
    image.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const n =
      (Math.random() - .5)
      * 2.4;

    data[i] += n;
    data[i + 1] += n;
    data[i + 2] += n;

  }

  ctx.putImageData(
    image,
    0,
    0
  );


  /*
     줄눈
  */

  ctx.strokeStyle =
    "rgba(75,75,75,.18)";

  ctx.lineWidth =
    2;

  ctx.strokeRect(
    1,
    1,
    size - 2,
    size - 2
  );


  /*
     타일 한 장 안의
     아주 미세한 조명 변화
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      size,
      size
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.045)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.02)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  texture.colorSpace =
    THREE.SRGBColorSpace;

  texture.anisotropy =
    renderer.capabilities
      .getMaxAnisotropy();

  return texture;

}


/* =====================================================
   WALL / FLOOR
===================================================== */

const wallMaterial =
  new THREE.MeshPhysicalMaterial({

    color: 0xffffff,

    metalness: 0,

    roughness: 0.84,

    envMapIntensity: 0.22

  });


const floorMaterial =
  new THREE.MeshPhysicalMaterial({

    color: 0xffffff,

    metalness: 0,

    roughness: 0.80,

    envMapIntensity: 0.26

  });


/*
   3.6m 벽
   600 타일 = 가로 6장
*/

const wall =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      3.6,
      2.4
    ),

    wallMaterial

  );

wall.position.set(
  0,
  1.2,
  -0.48
);

wall.receiveShadow =
  true;

scene.add(
  wall
);


/*
   바닥
*/

const floor =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      3.6,
      2.4
    ),

    floorMaterial

  );

floor.rotation.x =
  -Math.PI / 2;

floor.position.set(
  0,
  0,
  0.72
);

floor.receiveShadow =
  true;

scene.add(
  floor
);


let wallTexture;
let floorTexture;


function setTileColor(
  color
) {

  if (wallTexture)
    wallTexture.dispose();

  if (floorTexture)
    floorTexture.dispose();


  wallTexture =
    makeTileTexture(
      color
    );

  floorTexture =
    makeTileTexture(
      color
    );


  /*
     정확히 600 × 600
  */

  wallTexture.repeat.set(
    6,
    4
  );

  floorTexture.repeat.set(
    6,
    4
  );


  wallMaterial.map =
    wallTexture;

  floorMaterial.map =
    floorTexture;


  wallMaterial.needsUpdate =
    true;

  floorMaterial.needsUpdate =
    true;

}


setTileColor(
  "#BEB3A5"
);


/* =====================================================
   MONO MMA
===================================================== */

const basinMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      new THREE.Color(
        "#F4F3EF"
      ),

    metalness:
      0,

    /*
       반무광 MMA
    */
    roughness:
      0.30,

    ior:
      1.48,

    specularIntensity:
      0.68,

    envMapIntensity:
      1.05,

    /*
       아주 약한 표면 코팅 느낌
    */
    clearcoat:
      0.035,

    clearcoatRoughness:
      0.38

  });


/* =====================================================
   CHROME
===================================================== */

const faucetMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      new THREE.Color(
        "#D8DADC"
      ),

    metalness:
      1,

    roughness:
      0.10,

    envMapIntensity:
      1.75,

    clearcoat:
      0.03,

    clearcoatRoughness:
      0.10

  });


/* =====================================================
   ★ PRODUCT PIVOT
   핵심 부분

   화면 X
   카메라 X
   제품만 회전
===================================================== */

const productPivot =
  new THREE.Group();

productPivot.rotation.order =
  "YXZ";


/*
   벽걸이 세면대 높이
*/

productPivot.position.set(
  0,
  0.78,
  0.10
);

scene.add(
  productPivot
);


let product = null;


/* =====================================================
   ROTATION STATE
===================================================== */

let currentYaw = 0;
let targetYaw = 0;

let currentPitch = 0;
let targetPitch = 0;

let currentZoom = 1;
let targetZoom = 1;


/* 좌우 회전 제한 */
const minYaw =
  THREE.MathUtils.degToRad(-65);

const maxYaw =
  THREE.MathUtils.degToRad(65);


/* 위아래 회전 제한 */
const minPitch =
  THREE.MathUtils.degToRad(-10);

const maxPitch =
  THREE.MathUtils.degToRad(58);


const minZoom = 0.82;
const maxZoom = 1.55;

let yawVelocity = 0;


/* =====================================================
   MATERIAL DETECTION
===================================================== */

function chooseMaterial(
  material,
  objectName = ""
) {

  const matName =
    material?.name || "";

  const text =
    (
      matName +
      " " +
      objectName
    )
      .toLowerCase();


  /*
     기존 GLB 수전 재질
     Metal Corrugated Shiny
  */

  if (

    text.includes("metal") ||

    text.includes("corrugated") ||

    text.includes("chrome") ||

    text.includes("faucet") ||

    text.includes("silver") ||

    text.includes("cromo") ||

    text.includes("tap")

  ) {

    return faucetMaterial;

  }


  return basinMaterial;

}


/* =====================================================
   LOAD MONO 600
===================================================== */

const gltfLoader =
  new GLTFLoader();


gltfLoader.load(

  "./MONOBATH_MONO600.glb",


  gltf => {

    product =
      gltf.scene;


    /*
       웹 재질로 교체
    */

    product.traverse(

      object => {

        if (!object.isMesh)
          return;


        object.castShadow =
          true;

        object.receiveShadow =
          true;


        if (
          Array.isArray(
            object.material
          )
        ) {

          object.material =
            object.material.map(

              material =>
                chooseMaterial(
                  material,
                  object.name
                )

            );

        }

        else {

          object.material =
            chooseMaterial(
              object.material,
              object.name
            );

        }

      }

    );


    /*
       제품 실제 폭을
       정확히 600mm로 맞춤
    */

    product.updateMatrixWorld(
      true
    );


    let box =
      new THREE.Box3()
        .setFromObject(
          product
        );

    const size =
      new THREE.Vector3();

    box.getSize(
      size
    );


    const modelScale =
      0.60 /
      size.x;


    product.scale.setScalar(
      modelScale
    );


    product.updateMatrixWorld(
      true
    );


    /*
       ★ 매우 중요

       제품의 진짜 중심을
       productPivot의 0,0,0으로 이동.

       그래서 회전할 때
       제품이 빙글빙글 궤도를 돌지 않고

       그 자리에서 정확하게 회전함.
    */

    box =
      new THREE.Box3()
        .setFromObject(
          product
        );


    const center =
      new THREE.Vector3();

    box.getCenter(
      center
    );


    product.position.set(
      -center.x,
      -center.y,
      -center.z
    );


    productPivot.add(
      product
    );


    /*
       시작 크기
    */

    productPivot.scale.setScalar(
      1
    );


    loaderProgress.style.width =
      "100%";


    setTimeout(
      () => {

        loaderElement
          .classList
          .add(
            "hide"
          );

      },
      200
    );

  },


  xhr => {

    if (!xhr.total)
      return;


    const percent =
      (
        xhr.loaded /
        xhr.total
      ) * 100;


    loaderProgress.style.width =
      percent + "%";

  },


  error => {

    console.error(
      "MONO 600 GLB LOAD ERROR",
      error
    );

  }

);


/* =====================================================
   ★ DRAG
===================================================== */

let dragging = false;

let previousX = 0;
let previousY = 0;

let hasInteracted = false;


renderer.domElement.addEventListener(

  "pointerdown",

  event => {

    dragging =
      true;

    previousX =
      event.clientX;

    previousY =
      event.clientY;

    yawVelocity =
      0;


    renderer.domElement
      .setPointerCapture(
        event.pointerId
      );


    renderer.domElement.style.cursor =
      "grabbing";

  }

);


renderer.domElement.addEventListener(

  "pointermove",

  event => {

    if (
      !dragging ||
      !product
    )
      return;


    const dx =
      event.clientX -
      previousX;

    const dy =
      event.clientY -
      previousY;


    previousX =
      event.clientX;

    previousY =
      event.clientY;


    /*
       ★ 좌우

       CAMERA 안 움직임.

       제품 자체만 회전.
    */

    targetYaw +=
  dx * 0.0075;

targetYaw =
  THREE.MathUtils.clamp(
    targetYaw,
    minYaw,
    maxYaw
  );


    /*
       살짝 휙 돌리는 느낌
    */

    yawVelocity =
      dx * 0.0007;


    /*
       ★ 위 / 아래

       카메라가 올라가는 게 아니라

       제품 자체가 살짝 기울어져
       위쪽과 볼 내부를 보여줌.
    */

    targetPitch +=
      -dy * 0.006;


    targetPitch =
      THREE.MathUtils.clamp(

        targetPitch,

        minPitch,

        maxPitch

      );


    if (
      !hasInteracted &&
      (
        Math.abs(dx) > 5 ||
        Math.abs(dy) > 5
      )
    ) {

      hasInteracted =
        true;

      guide.classList.add(
        "hide"
      );

    }

  }

);


function endDrag(
  event
) {

  dragging =
    false;


  renderer.domElement.style.cursor =
    "grab";


  try {

    renderer.domElement
      .releasePointerCapture(
        event.pointerId
      );

  }

  catch(error) {}

}


renderer.domElement.addEventListener(
  "pointerup",
  endDrag
);

renderer.domElement.addEventListener(
  "pointercancel",
  endDrag
);


/* =====================================================
   ★ WHEEL = PRODUCT ZOOM ONLY
===================================================== */

renderer.domElement.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      event.deltaY < 0
    ) {

      targetZoom *=
        1.075;

    }

    else {

      targetZoom *=
        0.93;

    }


    targetZoom =
      THREE.MathUtils.clamp(

        targetZoom,

        minZoom,

        maxZoom

      );


    guide.classList.add(
      "hide"
    );

  },

  {
    passive: false
  }

);


/* =====================================================
   RESET
===================================================== */

document
  .getElementById(
    "resetView"
  )
  .addEventListener(

    "click",

    () => {

      targetYaw = 0;

      targetPitch = 0;

      targetZoom = 1;

      yawVelocity = 0;

    }

  );


/* =====================================================
   BASIN COLOR
===================================================== */

document
  .querySelectorAll(
    ".basin-swatch"
  )
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          document
            .querySelectorAll(
              ".basin-swatch"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          basinMaterial
            .color
            .set(
              button.dataset.color
            );


          basinName.textContent =
            button.dataset.name;

        }

      );

    }

  );


/* =====================================================
   TILE COLOR
===================================================== */

document
  .querySelectorAll(
    ".tile-swatch"
  )
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          document
            .querySelectorAll(
              ".tile-swatch"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          setTileColor(
            button.dataset.color
          );


          tileName.textContent =
            button.dataset.name;

        }

      );

    }

  );


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  "resize",

  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }

);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

  requestAnimationFrame(animate);

  if (product) {

    /*
       손을 놓았을 때 아주 약한 관성.
       좌우 제한에 닿으면 즉시 멈춤.
    */
    if (
      !dragging &&
      Math.abs(yawVelocity) > 0.00005
    ) {

      targetYaw += yawVelocity;

      targetYaw = THREE.MathUtils.clamp(
        targetYaw,
        minYaw,
        maxYaw
      );

      if (
        targetYaw <= minYaw ||
        targetYaw >= maxYaw
      ) {
        yawVelocity = 0;
      } else {
        yawVelocity *= 0.88;
      }
    }

    /*
       부드러운 보간
    */
    currentYaw +=
  (
    targetYaw -
    currentYaw
  ) * 0.095;

currentPitch +=
  (
    targetPitch -
    currentPitch
  ) * 0.085;

currentZoom +=
  (
    targetZoom -
    currentZoom
  ) * 0.08;

    /*
       카메라는 고정.
       제품 피벗만 회전 / 기울기 / 확대.
    */
    productPivot.rotation.y = currentYaw;
    productPivot.rotation.x = currentPitch;
    productPivot.scale.setScalar(currentZoom);
  }

  renderer.render(scene, camera);
}

animate();

</script>

</body>
