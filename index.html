<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MONOBATH — MONO 600 Configurator</title>

<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #B7ADA0;
    font-family:
      Arial,
      Helvetica,
      sans-serif;
  }

  body {
    color: #2E2E2E;
  }

  #app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #B7ADA0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    filter: contrast(1.14) saturate(1.04) brightness(0.98);
  }


  /* ===================================
     TOP BRAND
  =================================== */

  .brand {
    position: fixed;
    z-index: 20;

    top: 30px;
    left: 34px;

    pointer-events: none;
  }

  .brand-small {
    font-size: 10px;
    font-weight: 500;

    letter-spacing: 0.24em;

    color: rgba(46,46,46,.62);

    margin-bottom: 7px;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 600;

    letter-spacing: 0.05em;

    color: #2E2E2E;
  }


  /* ===================================
     TOP RIGHT
  =================================== */

  .top-controls {
    position: fixed;
    z-index: 20;

    top: 27px;
    right: 30px;

    display: flex;
    gap: 9px;
  }

  .ghost-button {
    height: 38px;

    padding: 0 16px;

    border-radius: 100px;

    border:
      1px solid rgba(46,46,46,.18);

    background:
      rgba(247,246,243,.72);

    backdrop-filter: blur(12px);

    font-size: 10px;
    font-weight: 500;

    letter-spacing: .12em;

    color: #2E2E2E;

    cursor: pointer;

    transition:
      background .25s ease,
      border-color .25s ease;
  }

  .ghost-button:hover {
    background:
      rgba(247,246,243,.95);

    border-color:
      rgba(46,46,46,.35);
  }


  /* ===================================
     CONFIGURATOR PANEL
  =================================== */

  .config-panel {

    position: fixed;

    z-index: 20;

    right: 30px;
    bottom: 30px;

    width: 270px;

    padding: 22px 22px 20px;

    border:
      1px solid rgba(46,46,46,.12);

    background:
      rgba(247,246,243,.84);

    backdrop-filter:
      blur(18px);

    border-radius: 3px;

    box-shadow:

  .option-block + .option-block {
    margin-top: 22px;
    padding-top: 20px;

    border-top:
      1px solid rgba(46,46,46,.10);
  }

  .option-label {

    font-weight: 600;

    letter-spacing: .19em;

    color: rgba(46,46,46,.54);

    margin-bottom: 13px;

  .option-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 12px;
    font-weight: 500;

    margin-bottom: 12px;
  }

  .current-value {
    font-size: 10px;

    color: rgba(46,46,46,.50);
  }

  .swatches {
    display: flex;
    gap: 10px;
  }

  .swatch {
    width: 31px;
    height: 31px;

    border-radius: 50%;

    border:
      1px solid rgba(46,46,46,.15);

    cursor: pointer;

    position: relative;

    transition:
      transform .2s ease,
      box-shadow .2s ease;
  }

  .swatch:hover {
    transform: scale(1.08);
  }

  .swatch.active::after {
    content: "";

    position: absolute;

    inset: -5px;

    border-radius: 50%;

    border:
      1px solid rgba(46,46,46,.65);
  }


  /* ===================================
     GUIDE
  =================================== */

  .guide {

    position: fixed;

    z-index: 20;

    left: 50%;
    bottom: 31px;

    transform:
      translateX(-50%);

    font-size: 9px;

    font-weight: 500;

    letter-spacing: .16em;

    color:

    pointer-events: none;

    white-space: nowrap;

    transition:
      opacity .5s ease;
  }

  .guide.hide {
    opacity: 0;
  }


  /* ===================================
     LOADER
  =================================== */

  #loader {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: #F7F6F3;

    transition:
      opacity .55s ease,
      visibility .55s ease;
  }

  #loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  .loader-brand {

    font-size: 12px;
    font-weight: 600;

    letter-spacing: .23em;

    margin-bottom: 19px;
  }

  .loader-line {

    overflow: hidden;
  }

  .loader-progress {

    width: 0%;

    background: #2E2E2E;

    transition:
      width .15s linear;
  }


  /* ===================================
     MOBILE
  =================================== */

    .brand {

    }

    .top-controls {

      right: 18px;

    .ghost-button {

      left: 14px;

    }

      height: 27px;
    }

    .guide {

      bottom: 150px;

      font-size: 8px;
    }

</style>

/* =====================================================
   DOM
===================================================== */

const container =

const guide =

/* =====================================================
   SCENE
===================================================== */

const scene =

scene.background =
  new THREE.Color("#B7ADA0");


/* =====================================================
   CAMERA
   ★ 카메라는 여기서 완전히 고정
===================================================== */

const camera =
  new THREE.PerspectiveCamera(
    34,
    window.innerWidth /
    window.innerHeight,

    100
  );

camera.position.set(
  0,
  1.12,

);

/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(

  )
);

renderer.outputColorSpace =

renderer.toneMapping =

  THREE.PCFSoftShadowMap;

renderer.domElement.style.cursor =

container.appendChild(
  renderer.domElement
);


/* =====================================================
   HDRI
===================================================== */

const pmrem =
  new THREE.PMREMGenerator(
    renderer
  );

const roomEnvironment =
  new RoomEnvironment();

scene.environment =
  pmrem
    .fromScene(
      roomEnvironment,
      0.04
    )

/*
   GitHub에 이미 있는 HDR
*/
new RGBELoader().load(

  "./white_studio_06_1k.hdr",

  hdr => {

    const env =
      pmrem
        .fromEquirectangular(
          hdr
        )
        .texture;

    scene.environment =
      env;

    hdr.dispose();

  },

  undefined,

  error => {

    console.warn(
      "HDRI load failed. Fallback active.",

    );

  }

);

===================================================== */

/* =====================================================
   TILE GENERATOR
===================================================== */

function makeTileTexture(
  baseColor
) {

  const size = 512;

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    size;

  canvas.height =
    size;

  const ctx =
    canvas.getContext(
      "2d"
    );


  /* base */

  ctx.fillStyle =
    baseColor;

  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  /*
     아주 미세한 표면 입자
  */

  const image =
    ctx.getImageData(
      0,
      0,
      size,
      size
    );

  const data =
    image.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const n =
      (Math.random() - .5)
      * 2.4;

    data[i] += n;
    data[i + 1] += n;
    data[i + 2] += n;

  }

  ctx.putImageData(
    image,
    0,
    0
  );


  /*
     줄눈
  */

  ctx.strokeStyle =
    "rgba(70,66,60,.28)";

  ctx.lineWidth =
    2;

  ctx.strokeRect(
    1,
    1,
    size - 2,
    size - 2
  );


  /*
     타일 한 장 안의
     아주 미세한 조명 변화
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      size,
      size
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.045)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.02)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  texture.colorSpace =
    THREE.SRGBColorSpace;

  texture.anisotropy =
    renderer.capabilities
      .getMaxAnisotropy();

  texture.minFilter =
    THREE.LinearMipmapLinearFilter;

  texture.magFilter =
    THREE.LinearFilter;

  texture.generateMipmaps = true;

  texture.needsUpdate = true;

  return texture;

}


/* =====================================================
   WALL / FLOOR
===================================================== */

const wallMaterial =
  new THREE.MeshPhysicalMaterial({

    color: 0xffffff,

    metalness: 0,

    roughness: 0.90,

    envMapIntensity: 0.10

  });


const floorMaterial =
  new THREE.MeshPhysicalMaterial({

    color: 0xffffff,

    metalness: 0,

    roughness: 0.86,

    envMapIntensity: 0.14

  });


/*
   3.6m 벽
   600 타일 = 가로 6장
*/

const wall =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      3.6,
      2.4
    ),

    wallMaterial

  );

wall.position.set(
  0,
  1.2,
  -0.48
);

wall.receiveShadow =
  true;

scene.add(
  wall
);


/*
   바닥
*/

const floor =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      3.6,
      2.4
    ),

    floorMaterial

  );

floor.rotation.x =
  -Math.PI / 2;

floor.position.set(
  0,
  0,
  0.72
);

floor.receiveShadow =
  true;

scene.add(
  floor
);


let wallTexture;
let floorTexture;


function setTileColor(
  color
) {

  if (wallTexture)
    wallTexture.dispose();

  if (floorTexture)
    floorTexture.dispose();


  wallTexture =
    makeTileTexture(
      color
    );

  floorTexture =
    makeTileTexture(
      color
    );


  /*
     정확히 600 × 600
  */

  wallTexture.repeat.set(
    6,
    4
  );

  floorTexture.repeat.set(
    6,
    4
  );


  wallMaterial.map =
    wallTexture;

  floorMaterial.map =
    floorTexture;


  wallMaterial.needsUpdate =
    true;

  floorMaterial.needsUpdate =
    true;

}


setTileColor(
  "#E8E7E3"
);


/* =====================================================
   MONO MMA
===================================================== */

const basinMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      new THREE.Color(
        "#F4F3EF"
      ),

    metalness:
      0,

    /*
       반무광 MMA
    */

      0.25,

    ior:
      1.48,

    specularIntensity:
      0.82,

    envMapIntensity:
      0.82,

    /*
       아주 약한 표면 코팅 느낌
    */

/* =====================================================
   CHROME
===================================================== */


/* =====================================================
   SOLID SURFACE CHIP TEXTURES
   PURE WHITE     = clean / no visible chips
   FROZEN WHITE   = translucent grey micro chips
   SAND BEIGE     = warm beige micro chips
   URBAN GREY     = grey + dark micro chips
===================================================== */

const basinStyles = {

  pureWhite: {
    name: "PURE WHITE",
    base: "#F4F3EF",
    roughness: 0.25,
    bumpScale: 0,
    seed: 11,
    chipSets: []
  },

  frozenWhite: {
    name: "FROZEN WHITE",
    base: "#F0F1EF",
    roughness: 0.27,
    bumpScale: 0.0020,
    seed: 29,
    chipSets: [
      { color: "#BFC3C1", count: 1800, minR: 0.90, maxR: 2.25, minA: 0.30, maxA: 0.55, bump: 145 },
      { color: "#AEB3B0", count: 620,  minR: 1.10, maxR: 3.10, minA: 0.25, maxA: 0.48, bump: 151 },
      { color: "#FFFFFF", count: 480,  minR: 0.70, maxR: 2.10, minA: 0.22, maxA: 0.42, bump: 138 },
      { color: "#D4D6D3", count: 150,  minR: 2.20, maxR: 5.20, minA: 0.20, maxA: 0.36, bump: 148 }
    ]
  },

  sandBeige: {
    name: "SAND BEIGE",
    base: "#D7C9AF",
    roughness: 0.29,
    bumpScale: 0.0024,
    seed: 47,
    chipSets: [
      { color: "#B5A487", count: 1450, minR: 0.95, maxR: 2.60, minA: 0.34, maxA: 0.62, bump: 149 },
      { color: "#EEE2CB", count: 980,  minR: 0.75, maxR: 2.35, minA: 0.30, maxA: 0.55, bump: 138 },
      { color: "#9E896D", count: 460,  minR: 1.10, maxR: 3.40, minA: 0.28, maxA: 0.52, bump: 154 },
      { color: "#F4EBDD", count: 140,  minR: 2.40, maxR: 5.50, minA: 0.20, maxA: 0.38, bump: 140 }
    ]
  },

  urbanGrey: {
    name: "URBAN GREY",
    base: "#92918E",
    roughness: 0.31,
    bumpScale: 0.0026,
    seed: 71,
    chipSets: [
      { color: "#5E605E", count: 1500, minR: 0.95, maxR: 2.65, minA: 0.36, maxA: 0.66, bump: 154 },
      { color: "#B5B5B1", count: 980,  minR: 0.75, maxR: 2.30, minA: 0.28, maxA: 0.54, bump: 138 },
      { color: "#414341", count: 520,  minR: 1.10, maxR: 3.60, minA: 0.32, maxA: 0.60, bump: 158 },
      { color: "#D0CFCA", count: 150,  minR: 2.35, maxR: 5.25, minA: 0.20, maxA: 0.40, bump: 138 }
    ]
  }

};


function seededRandom(seed) {

  let value = seed >>> 0;

  return () => {

    value += 0x6D2B79F5;

    let t = value;

    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  };

}


function createSolidSurfaceTextures(style) {

  if (!style.chipSets.length) {
    return {
      map: null,
      bumpMap: null,
      preview: style.base
    };
  }

  const size = 1024;
  const colorCanvas = document.createElement("canvas");
  const bumpCanvas = document.createElement("canvas");

  colorCanvas.width = colorCanvas.height = size;
  bumpCanvas.width = bumpCanvas.height = size;

  const ctx = colorCanvas.getContext("2d");
  const bumpCtx = bumpCanvas.getContext("2d");

  ctx.fillStyle = style.base;
  ctx.fillRect(0, 0, size, size);

  bumpCtx.fillStyle = "rgb(128,128,128)";
  bumpCtx.fillRect(0, 0, size, size);

  const random = seededRandom(style.seed);

  /*
     아주 약한 베이스 입자.
     멀리서는 단색처럼 보이고 가까이에서만 재질감이 남는다.
  */
  const baseImage = ctx.getImageData(0, 0, size, size);
  const pixels = baseImage.data;

  for (let i = 0; i < pixels.length; i += 4) {
    const variation = (random() - 0.5) * 1.25;
    pixels[i] += variation;
    pixels[i + 1] += variation;
    pixels[i + 2] += variation;
  }

  ctx.putImageData(baseImage, 0, 0);

  style.chipSets.forEach(set => {

    for (let i = 0; i < set.count; i++) {

      const x = random() * size;
      const y = random() * size;
      const radius = set.minR + random() * (set.maxR - set.minR);
      const alpha = set.minA + random() * (set.maxA - set.minA);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = set.color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      /* 완전한 원점 느낌을 줄이기 위한 작은 보조 입자 */
      if (radius > 1.2 && random() > 0.45) {
        ctx.globalAlpha = alpha * 0.55;
        ctx.beginPath();
        ctx.arc(
          x + (random() - 0.5) * radius,
          y + (random() - 0.5) * radius,
          radius * (0.25 + random() * 0.28),
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      bumpCtx.globalAlpha = 0.55;
      bumpCtx.fillStyle = `rgb(${set.bump},${set.bump},${set.bump})`;
      bumpCtx.beginPath();
      bumpCtx.arc(x, y, Math.max(0.45, radius * 0.85), 0, Math.PI * 2);
      bumpCtx.fill();

    }

  });

  ctx.globalAlpha = 1;
  bumpCtx.globalAlpha = 1;

  const map = new THREE.CanvasTexture(colorCanvas);
  const bumpMap = new THREE.CanvasTexture(bumpCanvas);

  [map, bumpMap].forEach(texture => {
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    /* SketchUp GLB UVs span a very large range.
       A small repeat value keeps chips at real visible scale. */
    texture.repeat.set(0.035, 0.035);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texture.minFilter = THREE.LinearMipmapLinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.generateMipmaps = true;
    texture.needsUpdate = true;
  });

  map.colorSpace = THREE.SRGBColorSpace;
  bumpMap.colorSpace = THREE.NoColorSpace;

  return {
    map,
    bumpMap,
    preview: colorCanvas.toDataURL("image/png")
  };

}


const basinTextureCache = {};

Object.entries(basinStyles).forEach(([key, style]) => {
  basinTextureCache[key] = createSolidSurfaceTextures(style);
});


function applyBasinStyle(key) {

  const style = basinStyles[key];
  const textures = basinTextureCache[key];

  if (!style || !textures) return;

  if (textures.map) {
    basinMaterial.color.set("#FFFFFF");
    basinMaterial.map = textures.map;
    basinMaterial.bumpMap = textures.bumpMap;
    basinMaterial.bumpScale = style.bumpScale;
  }
  else {
    basinMaterial.color.set(style.base);
    basinMaterial.map = null;
    basinMaterial.bumpMap = null;
    basinMaterial.bumpScale = 0;
  }

  basinMaterial.roughness = style.roughness;
  basinMaterial.needsUpdate = true;

  basinName.textContent = style.name;

}


/* 선택 버튼에도 실제 칩 패턴 미리보기 적용 */
document.querySelectorAll(".basin-swatch").forEach(button => {

  const key = button.dataset.key;
  const style = basinStyles[key];
  const preview = basinTextureCache[key]?.preview;

  if (!style) return;

  if (preview && preview.startsWith("data:")) {
    button.style.backgroundImage = `url(${preview})`;
    button.style.backgroundSize = "135% 135%";
    button.style.backgroundPosition = "center";
  }
  else {
    button.style.background = style.base;
  }

});


/* 기본 선택 = PURE WHITE */
applyBasinStyle("pureWhite");


const faucetMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      new THREE.Color(
        "#D8DADC"
      ),

    metalness:
      1,

    roughness:
      0.08,

    envMapIntensity:
      1.45,

    clearcoat:
      0.03,

    clearcoatRoughness:
      0.10

  });


/* =====================================================
   ★ PRODUCT PIVOT
   핵심 부분

   화면 X
   카메라 X
   제품만 회전
===================================================== */

const productPivot =
  new THREE.Group();

productPivot.rotation.order =
  "YXZ";


/*
   벽걸이 세면대 높이
*/

productPivot.position.set(
  0,
  0.78,
  0.10
);

scene.add(
  productPivot
);


let product = null;


/* =====================================================
   ROTATION STATE
===================================================== */

let currentYaw = 0;
let targetYaw = 0;

let currentPitch = 0;
let targetPitch = 0;

let currentZoom = 1;
let targetZoom = 1;


/* 좌우 회전 제한 */
const minYaw =
  THREE.MathUtils.degToRad(-65);

const maxYaw =
  THREE.MathUtils.degToRad(65);


/* 위아래 회전 제한 */
const minPitch =
  THREE.MathUtils.degToRad(-10);

const maxPitch =
  THREE.MathUtils.degToRad(58);


const minZoom = 0.82;
const maxZoom = 1.55;

let yawVelocity = 0;


/* =====================================================
   MATERIAL DETECTION
===================================================== */

function chooseMaterial(
  material,
  objectName = ""
) {

  const matName =
    material?.name || "";

  const text =
    (
      matName +
      " " +
      objectName
    )
      .toLowerCase();


  /*
     기존 GLB 수전 재질
     Metal Corrugated Shiny
  */

  if (

    text.includes("metal") ||

    text.includes("corrugated") ||

    text.includes("chrome") ||

    text.includes("faucet") ||

    text.includes("silver") ||

    text.includes("cromo") ||

    text.includes("tap")

  ) {

    return faucetMaterial;

  }


  return basinMaterial;

}


/* =====================================================
   LOAD MONO 600
===================================================== */

const gltfLoader =
  new GLTFLoader();


gltfLoader.load(

  "./MONOBATH_MONO600.glb",


  gltf => {

    product =
      gltf.scene;


    /*
       웹 재질로 교체
    */

    product.traverse(

      object => {

        if (!object.isMesh)
          return;


        object.castShadow =
          true;

        object.receiveShadow =
          true;


        if (
          Array.isArray(
            object.material
          )
        ) {

          object.material =
            object.material.map(

              material =>
                chooseMaterial(
                  material,
                  object.name
                )

            );

        }

        else {

          object.material =
            chooseMaterial(
              object.material,
              object.name
            );

        }

      }

    );


    /*
       제품 실제 폭을
       정확히 600mm로 맞춤
    */

    product.updateMatrixWorld(
      true
    );


    let box =
      new THREE.Box3()
        .setFromObject(
          product
        );

    const size =
      new THREE.Vector3();

    box.getSize(
      size
    );


    const modelScale =
      0.60 /
      size.x;


    product.scale.setScalar(
      modelScale
    );


    product.updateMatrixWorld(
      true
    );


    /*
       ★ 매우 중요

       제품의 진짜 중심을
       productPivot의 0,0,0으로 이동.

       그래서 회전할 때
       제품이 빙글빙글 궤도를 돌지 않고

       그 자리에서 정확하게 회전함.
    */

    box =
      new THREE.Box3()
        .setFromObject(
          product
        );


    const center =
      new THREE.Vector3();

    box.getCenter(
      center
    );


    product.position.set(
      -center.x,
      -center.y,
      -center.z
    );


    productPivot.add(
      product
    );


    /*
       시작 크기
    */

    productPivot.scale.setScalar(
      1
    );


    loaderProgress.style.width =
      "100%";


    setTimeout(
      () => {

        loaderElement
          .classList
          .add(
            "hide"
          );

      },
      200
    );

  },


  xhr => {

    if (!xhr.total)
      return;


    const percent =
      (
        xhr.loaded /
        xhr.total
      ) * 100;


    loaderProgress.style.width =
      percent + "%";

  },


  error => {

    console.error(
      "MONO 600 GLB LOAD ERROR",
      error
    );

  }

);


/* =====================================================
   ★ DRAG
===================================================== */

let dragging = false;

let previousX = 0;
let previousY = 0;

let hasInteracted = false;


renderer.domElement.addEventListener(

  "pointerdown",

  event => {

    dragging =
      true;

    previousX =
      event.clientX;

    previousY =
      event.clientY;

    yawVelocity =
      0;


    renderer.domElement
      .setPointerCapture(
        event.pointerId
      );


    renderer.domElement.style.cursor =
      "grabbing";

  }

);


renderer.domElement.addEventListener(

  "pointermove",

  event => {

    if (
      !dragging ||
      !product
    )
      return;


    const dx =
      event.clientX -
      previousX;

    const dy =
      event.clientY -
      previousY;


    previousX =
      event.clientX;

    previousY =
      event.clientY;


    /*
       ★ 좌우

       CAMERA 안 움직임.

       제품 자체만 회전.
    */

    targetYaw +=
      dx * 0.0075;

targetYaw =
  THREE.MathUtils.clamp(
    targetYaw,
    minYaw,
    maxYaw
  );


    /*
       살짝 휙 돌리는 느낌
    */

    yawVelocity =
      dx * 0.0007;


    /*
       ★ 위 / 아래

       카메라가 올라가는 게 아니라

       제품 자체가 살짝 기울어져
       위쪽과 볼 내부를 보여줌.
    */

    targetPitch +=
      dy * 0.006;


    targetPitch =
      THREE.MathUtils.clamp(

        targetPitch,

        minPitch,

        maxPitch

      );


    if (
      !hasInteracted &&
      (
        Math.abs(dx) > 5 ||
        Math.abs(dy) > 5
      )
    ) {

      hasInteracted =
        true;

      guide.classList.add(
        "hide"
      );

    }

  }

);


function endDrag(
  event
) {

  dragging =
    false;


  renderer.domElement.style.cursor =
    "grab";


  try {

    renderer.domElement
      .releasePointerCapture(
        event.pointerId
      );

  }

  catch(error) {}

}


renderer.domElement.addEventListener(
  "pointerup",
  endDrag
);

renderer.domElement.addEventListener(
  "pointercancel",
  endDrag
);


/* =====================================================
   ★ WHEEL = PRODUCT ZOOM ONLY
===================================================== */

renderer.domElement.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      event.deltaY < 0
    ) {

      targetZoom *=
        1.075;

    }

    else {

      targetZoom *=
        0.93;

    }


    targetZoom =
      THREE.MathUtils.clamp(

        targetZoom,

        minZoom,

        maxZoom

      );


    guide.classList.add(
      "hide"
    );

  },

  {
    passive: false
  }

);


/* =====================================================
   RESET
===================================================== */

document
  .getElementById(
    "resetView"
  )
  .addEventListener(

    "click",

    () => {

      targetYaw = 0;

      targetPitch = 0;

      targetZoom = 1;

      yawVelocity = 0;

    }

  );


/* =====================================================
   BASIN COLOR
===================================================== */

document
  .querySelectorAll(
    ".basin-swatch"
  )
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          document
            .querySelectorAll(
              ".basin-swatch"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          applyBasinStyle(
            button.dataset.key
          );

        }

      );

    }

  );


/* =====================================================
   TILE COLOR
===================================================== */

document
  .querySelectorAll(
    ".tile-swatch"
  )
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          document
            .querySelectorAll(
              ".tile-swatch"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          setTileColor(
            button.dataset.color
          );


          tileName.textContent =
            button.dataset.name;

        }

      );

    }

  );


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  "resize",

  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }

);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

  requestAnimationFrame(animate);

  if (product) {

    /*
       손을 놓았을 때 아주 약한 관성.
       좌우 제한에 닿으면 즉시 멈춤.
    */
    if (
      !dragging &&
      Math.abs(yawVelocity) > 0.00005
    ) {

      targetYaw += yawVelocity;

      targetYaw = THREE.MathUtils.clamp(
        targetYaw,
        minYaw,
        maxYaw
      );

      if (
        targetYaw <= minYaw ||
        targetYaw >= maxYaw
      ) {
        yawVelocity = 0;
      } else {
        yawVelocity *= 0.88;
      }
    }

    /*
       부드러운 보간
    */
    currentYaw +=
      (targetYaw - currentYaw) * 0.095;

    currentPitch +=
      (targetPitch - currentPitch) * 0.085;

    currentZoom +=
      (targetZoom - currentZoom) * 0.08;

    /*
       카메라는 고정.
       제품 피벗만 회전 / 기울기 / 확대.
    */
    productPivot.rotation.y = currentYaw;
    productPivot.rotation.x = currentPitch;
    productPivot.scale.setScalar(currentZoom);
  }

  renderer.render(scene, camera);
}

animate();

</script>
