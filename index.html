<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>MONOBATH Virtual View</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F6F3;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background: #F7F6F3;
    }

    #viewer.dragging {
      cursor: grabbing;
    }

    #panorama {
      position: absolute;
      top: 50%;
      left: 50%;

      height: 100%;
      width: auto;

      max-width: none;
      max-height: none;

      transform: translate(-50%, -50%);
      transform-origin: center center;

      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
    }

    .brand-small {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #A49E94;
      margin-bottom: 7px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #2E2E2E;
    }

    .guide {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 10;

      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(46, 46, 46, 0.52);

      white-space: nowrap;
      pointer-events: none;
    }

    .close {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 20;

      width: 42px;
      height: 42px;

      border: 1px solid rgba(46,46,46,0.18);
      border-radius: 50%;

      background: rgba(247,246,243,0.82);
      backdrop-filter: blur(8px);

      color: #2E2E2E;
      font-size: 23px;
      font-weight: 300;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    @media (max-width: 768px) {

      .brand {
        top: 20px;
        left: 20px;
      }

      .close {
        top: 16px;
        right: 16px;
      }

      .guide {
        bottom: 20px;
        font-size: 9px;
      }

      #panorama {
        height: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="viewer">

    <img
      id="panorama"
      src="./MONOBATH_PANORAMA.png"
      alt="MONOBATH panoramic bathroom">

    <div class="brand">
      <div class="brand-small">MONOBATH</div>
      <div class="brand-title">VIRTUAL VIEW</div>
    </div>

    <button class="close"
            onclick="closeViewer()"
            aria-label="Close">
      ×
    </button>

    <div class="guide">
      DRAG TO EXPLORE
    </div>

  </div>


  <script>

    const viewer = document.getElementById('viewer');
    const panorama = document.getElementById('panorama');

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let currentX = 0;
    let currentY = 0;

    let startOffsetX = 0;
    let startOffsetY = 0;

    const verticalLimit = 35;


    function getHorizontalLimit() {

      const imageWidth = panorama.offsetWidth;
      const viewerWidth = viewer.offsetWidth;

      return Math.max(
        0,
        (imageWidth - viewerWidth) / 2
      );
    }


    function updatePosition() {

      const horizontalLimit = getHorizontalLimit();

      currentX = Math.max(
        -horizontalLimit,
        Math.min(horizontalLimit, currentX)
      );

      currentY = Math.max(
        -verticalLimit,
        Math.min(verticalLimit, currentY)
      );

      panorama.style.transform =
        `translate(calc(-50% + ${currentX}px),
                   calc(-50% + ${currentY}px))`;
    }


    viewer.addEventListener('pointerdown', (event) => {

      dragging = true;

      viewer.classList.add('dragging');

      startX = event.clientX;
      startY = event.clientY;

      startOffsetX = currentX;
      startOffsetY = currentY;

      viewer.setPointerCapture(event.pointerId);
    });


    viewer.addEventListener('pointermove', (event) => {

      if (!dragging) return;

      const deltaX = event.clientX - startX;
      const deltaY = event.clientY - startY;

      currentX = startOffsetX + deltaX;
      currentY = startOffsetY + deltaY * 0.25;

      updatePosition();
    });


    viewer.addEventListener('pointerup', (event) => {

      dragging = false;

      viewer.classList.remove('dragging');

      try {
        viewer.releasePointerCapture(event.pointerId);
      } catch (e) {}
    });


    viewer.addEventListener('pointercancel', () => {

      dragging = false;

      viewer.classList.remove('dragging');
    });


    panorama.addEventListener('load', () => {

      currentX = 0;
      currentY = 0;

      updatePosition();
    });


    window.addEventListener('resize', updatePosition);


    function closeViewer() {

      if (window.parent !== window) {

        window.parent.postMessage(
          'MONOBATH_CLOSE_VIEWER',
          '*'
        );

      } else {

        window.history.back();

      }
    }

  </script>

</body>
</html>
