<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MONOBATH Virtual View</title>

  <!-- Pannellum -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <script
    src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F6F3;
      font-family: Arial, sans-serif;
    }

    #panorama {
      width: 100vw;
      height: 100vh;
    }

    /* 기본 Pannellum 컨트롤 숨김 */
    .pnlm-controls-container {
      display: none !important;
    }

    .brand {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 100;
      pointer-events: none;
    }

    .brand-small {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.75);
      margin-bottom: 7px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #FFFFFF;
    }

    .guide {
      position: fixed;
      left: 50%;
      bottom: 27px;
      transform: translateX(-50%);
      z-index: 100;

      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.75);

      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .brand {
        top: 20px;
        left: 20px;
      }

      .guide {
        bottom: 20px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div id="panorama"></div>

  <div class="brand">
    <div class="brand-small">MONOBATH</div>
    <div class="brand-title">VIRTUAL VIEW</div>
  </div>

  <div class="guide">
    DRAG TO EXPLORE
  </div>

  <script>

    pannellum.viewer('panorama', {

      type: 'equirectangular',

      panorama: './MONOBATH_PANORAMA_360_V2.png',

      autoLoad: true,

      autoRotate: 0,

      showControls: false,

      mouseZoom: true,

      draggable: true,

      keyboardZoom: false,

      compass: false,

      /*
       * 시작 시점
       */
      yaw: 0,
      pitch: 0,
      hfov: 115,

      /*
       * 좌우 회전 제한
       * 뒤쪽까지 돌아가지 않도록 제한
       */
      minYaw: -85,
      maxYaw: 85,

      /*
       * 위아래 제한
       */
      minPitch: -25,
      maxPitch: 35,

      /*
       * 줌 제한
       */
      minHfov: 55,
      maxHfov: 120,

      friction: 0.18

    });

  </script>

</body>
</html>
