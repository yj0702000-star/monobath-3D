<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MONOBATH Interactive View</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #191919;
  font-family: Arial, sans-serif;
}

/* =========================
   VIEWER
========================= */

#viewer {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  user-select: none;
  background: #191919;
}

#viewer.dragging {
  cursor: grabbing;
}

/* =========================
   IMAGE
========================= */

#scene {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform-origin: center center;
  will-change: transform;

  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* =========================
   SUBTLE OVERLAY
========================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.13) 0%,
      rgba(0,0,0,0) 22%,
      rgba(0,0,0,0) 75%,
      rgba(0,0,0,.12) 100%
    );
}

/* =========================
   BRAND
========================= */

.brand {
  position: fixed;
  top: 28px;
  left: 32px;
  z-index: 100;
  pointer-events: none;
}

.brand-small {
  margin-bottom: 7px;
  font-size: 10px;
  letter-spacing: .22em;
  color: rgba(255,255,255,.76);
}

.brand-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .05em;
  color: #fff;
}

/* =========================
   CLOSE
========================= */

.close {
  position: fixed;
  top: 24px;
  right: 28px;
  z-index: 200;

  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50%;

  color: white;
  font-size: 25px;
  font-weight: 200;

  cursor: pointer;

  background: rgba(0,0,0,.10);
  backdrop-filter: blur(5px);

  transition:
    background .25s ease,
    border-color .25s ease;
}

.close:hover {
  background: rgba(0,0,0,.28);
  border-color: rgba(255,255,255,.7);
}

/* =========================
   GUIDE
========================= */

.guide {
  position: fixed;
  left: 50%;
  bottom: 27px;
  transform: translateX(-50%);
  z-index: 100;

  font-size: 10px;
  letter-spacing: .18em;

  color: rgba(255,255,255,.82);

  white-space: nowrap;
  pointer-events: none;

  transition: opacity .5s ease;
}

.guide.hide {
  opacity: 0;
}

/* =========================
   ZOOM INDICATOR
========================= */

.zoom-indicator {
  position: fixed;
  right: 30px;
  bottom: 27px;
  z-index: 100;

  font-size: 10px;
  letter-spacing: .12em;

  color: rgba(255,255,255,.7);
  pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .brand {
    top: 20px;
    left: 20px;
  }

  .close {
    top: 17px;
    right: 17px;
    width: 38px;
    height: 38px;
  }

  .guide {
    bottom: 20px;
    font-size: 9px;
  }

  .zoom-indicator {
    display: none;
  }
}
</style>
</head>

<body>

<div id="viewer">

  <img
    id="scene"
    src="./MONOBATH_PANORAMA_180_FINAL_8K.png"
    alt="MONOBATH Interactive View"
    draggable="false"
  >

</div>

<div class="overlay"></div>

<div class="brand">
  <div class="brand-small">MONOBATH</div>
  <div class="brand-title">INTERACTIVE VIEW</div>
</div>

<div class="close" id="closeButton">×</div>

<div class="guide" id="guide">
  DRAG TO EXPLORE · SCROLL TO ZOOM
</div>

<div class="zoom-indicator" id="zoomIndicator">
  100%
</div>


<script>

const viewer = document.getElementById("viewer");
const scene = document.getElementById("scene");
const guide = document.getElementById("guide");
const zoomIndicator = document.getElementById("zoomIndicator");
const closeButton = document.getElementById("closeButton");


/* =========================
   STATE
========================= */

let scale = 1;

const minScale = 1;
const maxScale = 2.6;

let x = 0;
let y = 0;

let startX = 0;
let startY = 0;

let startPanX = 0;
let startPanY = 0;

let dragging = false;
let hasInteracted = false;


/* =========================
   LIMIT POSITION
========================= */

function clampPosition() {

  const width = viewer.clientWidth;
  const height = viewer.clientHeight;

  const maxX = ((width * scale) - width) / 2;
  const maxY = ((height * scale) - height) / 2;

  x = Math.max(-maxX, Math.min(maxX, x));
  y = Math.max(-maxY, Math.min(maxY, y));
}


/* =========================
   RENDER
========================= */

function render() {

  clampPosition();

  scene.style.transform =
    `translate(calc(-50% + ${x}px),
               calc(-50% + ${y}px))
     scale(${scale})`;

  zoomIndicator.textContent =
    `${Math.round(scale * 100)}%`;
}


/* =========================
   DRAG START
========================= */

viewer.addEventListener("pointerdown", e => {

  dragging = true;

  startX = e.clientX;
  startY = e.clientY;

  startPanX = x;
  startPanY = y;

  viewer.classList.add("dragging");

  viewer.setPointerCapture(e.pointerId);
});


/* =========================
   DRAG MOVE
========================= */

viewer.addEventListener("pointermove", e => {

  if (!dragging) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  x = startPanX + dx;
  y = startPanY + dy;

  render();

  if (!hasInteracted &&
      (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {

    hasInteracted = true;
    guide.classList.add("hide");
  }

});


/* =========================
   DRAG END
========================= */

function endDrag(e) {

  dragging = false;
  viewer.classList.remove("dragging");

  try {
    viewer.releasePointerCapture(e.pointerId);
  } catch(err) {}
}

viewer.addEventListener("pointerup", endDrag);
viewer.addEventListener("pointercancel", endDrag);


/* =========================
   MOUSE WHEEL ZOOM
========================= */

viewer.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    const oldScale = scale;

    const zoomSpeed = 0.12;

    if (e.deltaY < 0) {
      scale += zoomSpeed;
    } else {
      scale -= zoomSpeed;
    }

    scale = Math.max(
      minScale,
      Math.min(maxScale, scale)
    );


    /*
      마우스가 있는 위치를 중심으로
      확대되는 느낌
    */

    if (scale !== oldScale) {

      const rect =
        viewer.getBoundingClientRect();

      const mouseX =
        e.clientX -
        rect.left -
        rect.width / 2;

      const mouseY =
        e.clientY -
        rect.top -
        rect.height / 2;

      const ratio =
        scale / oldScale;

      x =
        mouseX -
        (mouseX - x) * ratio;

      y =
        mouseY -
        (mouseY - y) * ratio;

    }

    render();

    guide.classList.add("hide");

  },
  { passive: false }
);


/* =========================
   DOUBLE CLICK RESET
========================= */

viewer.addEventListener(
  "dblclick",
  () => {

    scale = 1;
    x = 0;
    y = 0;

    render();

  }
);


/* =========================
   CLOSE
========================= */

closeButton.addEventListener(
  "click",
  () => {

    /*
      나중에 아임웹 모달과 연결하면
      여기만 바꾸면 됨.

      현재 GitHub 단독 테스트에서는
      이전 페이지로 이동.
    */

    if (window.history.length > 1) {
      window.history.back();
    }

  }
);


/* =========================
   INITIALIZE
========================= */

scene.addEventListener(
  "load",
  () => {

    scale = 1;
    x = 0;
    y = 0;

    render();

  }
);


window.addEventListener(
  "resize",
  render
);


if (scene.complete) {
  render();
}

</script>

</body>
</html>
